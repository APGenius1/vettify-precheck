<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>TrayDay Discipline | Professional Risk Management for Traders</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0e27;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* Premium Dark Theme */
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-glow: rgba(99, 102, 241, 0.3);
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --info: #3b82f6;
            --dark-bg: #0a0e27;
            --card-bg: rgba(15, 23, 42, 0.95);
            --border: rgba(255, 255, 255, 0.08);
            --text-secondary: #94a3b8;
        }

        /* Glassmorphism Navigation */
        .navbar {
            background: rgba(10, 14, 39, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 1rem 2rem;
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .logo-icon {
            font-size: 1.8rem;
        }

        .logo-sub {
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-left: 0.5rem;
        }

        .nav-links {
            display: flex;
            gap: 0.5rem;
            background: rgba(255, 255, 255, 0.05);
            padding: 0.25rem;
            border-radius: 12px;
        }

        .nav-btn {
            padding: 0.6rem 1.2rem;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-weight: 500;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .nav-btn:hover {
            color: white;
            background: rgba(255, 255, 255, 0.1);
        }

        .nav-btn.active {
            background: var(--primary);
            color: white;
        }

        .funded-toggle {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            padding: 0.5rem 1rem;
            border-radius: 10px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .funded-toggle.active {
            background: var(--warning);
            color: #0a0e27;
            border-color: var(--warning);
        }

        /* Main Content */
        .main-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* Cards */
        .trade-form-card, .analysis-card, .stats-grid, .rules-form {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 2rem;
            margin-bottom: 2rem;
        }

        h2 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            font-weight: 600;
        }

        h3 {
            font-size: 1.2rem;
            margin-bottom: 1rem;
            font-weight: 600;
        }

        /* Form Grid */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        input, select, textarea {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0.75rem 1rem;
            color: white;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }

        /* Position Toggle */
        .position-toggle {
            display: flex;
            gap: 0.5rem;
        }

        .pos-btn {
            flex: 1;
            padding: 0.75rem;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: white;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .pos-btn.active-buy {
            background: linear-gradient(135deg, #10b981, #059669);
            border-color: #10b981;
        }

        .pos-btn.active-sell {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            border-color: #ef4444;
        }

        /* Confidence Slider */
        input[type="range"] {
            width: 100%;
            padding: 0;
            background: var(--border);
        }

        input[type="range"]::-webkit-slider-thumb {
            background: var(--primary);
            cursor: pointer;
        }

        .confidence-value {
            text-align: center;
            font-size: 0.85rem;
            color: var(--primary);
            font-weight: 600;
        }

        /* Buttons */
        .action-buttons {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        .btn-analyze, .btn-save, .btn-save-rules {
            flex: 1;
            padding: 0.9rem;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .btn-analyze {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
        }

        .btn-analyze:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px var(--primary-glow);
        }

        .btn-save {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid var(--border);
        }

        .btn-save:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Analysis Card */
        .analysis-card {
            animation: slideUp 0.5s ease;
        }

        .analysis-card.pass {
            border-left: 4px solid var(--success);
        }

        .analysis-card.fail {
            border-left: 4px solid var(--danger);
        }

        .analysis-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .status-badge {
            padding: 0.35rem 0.9rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .status-badge.pass {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
        }

        .status-badge.fail {
            background: rgba(239, 68, 68, 0.2);
            color: var(--danger);
        }

        .analysis-metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
        }

        .metric {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .metric-label {
            font-size: 0.7rem;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        .metric-value {
            font-size: 1.3rem;
            font-weight: 700;
        }

        .metric-value.success {
            color: var(--success);
        }

        .metric-value.danger {
            color: var(--danger);
        }

        .analysis-feedback {
            background: rgba(99, 102, 241, 0.1);
            padding: 1rem;
            border-radius: 12px;
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .feedback-icon {
            font-size: 1.5rem;
        }

        .feedback-text {
            line-height: 1.5;
            color: var(--text-secondary);
        }

        .warnings-list {
            margin-top: 1rem;
        }

        .warning-item {
            padding: 0.5rem;
            color: var(--warning);
            font-size: 0.85rem;
        }

        .funded-warning {
            margin-top: 1rem;
            padding: 1rem;
            background: rgba(245, 158, 11, 0.1);
            border-radius: 12px;
            color: var(--warning);
            font-weight: 600;
            text-align: center;
        }

        /* Dashboard Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            padding: 0;
            background: transparent;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 1.5rem;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-icon {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.8rem;
        }

        .rules-compliance {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .discipline-meter {
            background: rgba(255, 255, 255, 0.1);
            height: 8px;
            border-radius: 10px;
            overflow: hidden;
            margin: 1rem 0;
        }

        .discipline-fill {
            background: linear-gradient(90deg, var(--primary), var(--success));
            height: 100%;
            border-radius: 10px;
            transition: width 1s ease;
        }

        /* Trade Journal */
        .trades-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .trade-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.25rem;
            transition: all 0.3s ease;
        }

        .trade-card:hover {
            border-color: var(--primary);
            transform: translateX(5px);
        }

        .trade-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--border);
        }

        .trade-pair {
            font-weight: 700;
            font-size: 1.1rem;
        }

        .trade-type {
            margin-left: 0.75rem;
            padding: 0.2rem 0.6rem;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 600;
        }

        .trade-type.buy {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
        }

        .trade-type.sell {
            background: rgba(239, 68, 68, 0.2);
            color: var(--danger);
        }

        .trade-date {
            color: var(--text-secondary);
            font-size: 0.75rem;
        }

        .trade-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 0.5rem;
            margin-bottom: 0.75rem;
            font-size: 0.85rem;
        }

        .trade-feedback {
            background: rgba(99, 102, 241, 0.1);
            padding: 0.5rem;
            border-radius: 8px;
            font-size: 0.8rem;
            margin: 0.5rem 0;
        }

        .trade-notes {
            color: var(--text-secondary);
            font-size: 0.8rem;
            margin: 0.5rem 0;
        }

        .trade-result-buttons {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.75rem;
        }

        .result-win, .result-loss {
            flex: 1;
            padding: 0.5rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .result-win {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
        }

        .result-win:hover {
            background: var(--success);
            color: white;
        }

        .result-loss {
            background: rgba(239, 68, 68, 0.2);
            color: var(--danger);
        }

        .result-loss:hover {
            background: var(--danger);
            color: white;
        }

        .trade-result {
            margin-top: 0.75rem;
            text-align: center;
            padding: 0.5rem;
            border-radius: 8px;
            font-weight: 700;
        }

        .trade-result.win {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
        }

        .trade-result.loss {
            background: rgba(239, 68, 68, 0.2);
            color: var(--danger);
        }

        /* Rules Page */
        .rules-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        .rules-form {
            margin-bottom: 0;
        }

        .rule-item {
            margin-bottom: 1.5rem;
        }

        .rule-item small {
            display: block;
            margin-top: 0.25rem;
            color: var(--text-secondary);
            font-size: 0.7rem;
        }

        .btn-save-rules {
            width: 100%;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
        }

        .discipline-tips {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 1.5rem;
        }

        .discipline-tips h4 {
            margin-bottom: 1rem;
        }

        .discipline-tips ul {
            list-style: none;
        }

        .discipline-tips li {
            padding: 0.5rem 0;
            color: var(--text-secondary);
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-secondary);
        }

        /* Animations */
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .navbar {
                padding: 0.75rem 1rem;
            }

            .nav-container {
                flex-direction: column;
                gap: 1rem;
            }

            .nav-links {
                width: 100%;
                justify-content: center;
            }

            .nav-btn {
                padding: 0.4rem 0.8rem;
                font-size: 0.8rem;
            }

            .main-content {
                padding: 1rem;
            }

            .trade-form-card, .analysis-card {
                padding: 1.25rem;
            }

            .action-buttons {
                flex-direction: column;
            }

            .rules-container {
                grid-template-columns: 1fr;
            }

            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <span class="logo-icon">📊</span>
                TrayDay Discipline
                <span class="logo-sub">Beta</span>
            </div>
            <div class="nav-links">
                <button class="nav-btn active" data-tab="trade">New Trade</button>
                <button class="nav-btn" data-tab="dashboard">Dashboard</button>
                <button class="nav-btn" data-tab="journal">Journal</button>
                <button class="nav-btn" data-tab="rules">Rules</button>
            </div>
            <button class="funded-toggle" id="fundedToggle">
                🛡️ Funded Mode OFF
            </button>
        </div>
    </nav>

    <main class="main-content">
        <!-- Trade Tab -->
        <div id="tradeTab" class="tab-content">
            <div class="trade-form-card">
                <h2>📝 Enter Trade Details</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Currency Pair</label>
                        <select id="currencyPair">
                            <option>EUR/USD</option>
                            <option>GBP/USD</option>
                            <option>USD/JPY</option>
                            <option>AUD/USD</option>
                            <option>USD/CAD</option>
                            <option>NZD/USD</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Position</label>
                        <div class="position-toggle">
                            <button class="pos-btn active-buy" id="buyBtn">📈 BUY</button>
                            <button class="pos-btn" id="sellBtn">📉 SELL</button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Account Size ($)</label>
                        <input type="number" id="accountSize" value="10000">
                    </div>

                    <div class="form-group">
                        <label>Entry Price</label>
                        <input type="number" step="0.00001" id="entryPrice" value="1.0850">
                    </div>

                    <div class="form-group">
                        <label>Stop Loss</label>
                        <input type="number" step="0.00001" id="stopLoss" value="1.0820">
                    </div>

                    <div class="form-group">
                        <label>Take Profit (optional)</label>
                        <input type="number" step="0.00001" id="takeProfit" value="1.0910">
                    </div>

                    <div class="form-group">
                        <label>Lot Size (optional)</label>
                        <input type="number" step="0.01" id="lotSize" placeholder="Auto-calculated">
                    </div>

                    <div class="form-group">
                        <label>Confidence (1-10)</label>
                        <input type="range" min="1" max="10" id="confidence" value="5">
                        <div class="confidence-value" id="confidenceValue">5/10</div>
                    </div>

                    <div class="form-group full-width">
                        <label>Notes</label>
                        <textarea id="notes" rows="3" placeholder="Trade setup notes..."></textarea>
                    </div>
                </div>

                <div class="action-buttons">
                    <button class="btn-analyze" id="analyzeBtn">🔍 Analyze Trade</button>
                    <button class="btn-save" id="saveBtn">
